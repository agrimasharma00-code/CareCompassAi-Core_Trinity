services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////app/db/carecompass.db
      ML_SERVICE_URL: http://ml-service:8001
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data:ro
      - carecompass-db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  frontend:
    build: ./frontend
    env_file: ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
  ml-service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    environment:
      ML_SERVICE_PORT: 8001
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8001:8001"
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  carecompass-db:
